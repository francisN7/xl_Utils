# ==============================
# Configurações de build
# ==============================

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


# ==============================
# Configuração do projeto
# ==============================

[project]
name = "xl_Utils"
version = "0.1.0"
description = "A series of mini-scripts focused on the objective resolution of minor daily problems in spreadsheet handling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "demoji>=1.1.0",
    "file-picker-py>=0.2.0",
    "lxml>=6.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14",
    "xlrd>=2.0.2",
    "xlsx2csv>=0.8.4",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
xrun = "xl_Utils.main:xrun"

# Localização dos pacotes
[tool.setuptools.packages.find]
where = ["src"]
