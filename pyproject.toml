[project]
name = "xl-utils"
version = "0.1.0"
description = "A collection of spreadsheet utilities with a unified desktop interface."
readme = "README.md"
authors = [
    { name = "francisN7", email = "99262638+francisN7@users.noreply.github.com" },
]
requires-python = ">=3.15"
dependencies = [
    "emoji>=2.16.0",
    "flet[desktop]>=1.0.5,<1.1",
    "google-auth-oauthlib>=1.5.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "puremagic>=2.2.0",
    "pyperclip>=1.11.0",
    "python-calamine>=0.9.1",
    "xlsxwriter>=3.3.1",
]

[project.gui-scripts]
xl-utils = "xl_utils.app:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
