name: Pages

# Publica apenas o site (home e privacidade). Código, testes e docs internos
# não disparam deployment: o filtro de caminho evita a republicação a cada push.
on:
  push:
    branches: [main]
    paths:
      - docs/*.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o site
        run: |
          mkdir -p _site
          cp docs/*.html _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # O upload-pages-artifact é composto e chama upload-artifact por tag; a
      # política do repositório exige SHA completo em toda ação. O tar abaixo é
      # o mesmo formato que ele produz.
      - name: Empacotar
        run: |
          tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
