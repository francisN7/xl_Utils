name: Pages

# Publica apenas o site (home e privacidade). Código, testes e docs internos
# não disparam deployment: o filtro de caminho evita a republicação a cada push.
on:
  push:
    branches: [main]
    paths:
      - docs/*.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Preparar o site
        run: |
          mkdir -p _site
          cp docs/*.html _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # O upload-pages-artifact é composto e chama upload-artifact por tag; a
      # política do repositório exige SHA completo em toda ação. O tar abaixo é
      # o mesmo formato que ele produz.
      - name: Empacotar
        run: |
          tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
